[build]
  command = "node scripts/build.js"
  publish = "."

[build.environment]
  # Your site address and Supabase URL are public, not secret. Real keys stay protected.
  SECRETS_SCAN_OMIT_KEYS = "SITE_URL,SUPABASE_URL"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Always fetch fresh content so edits from /admin show up right after a deploy
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
